<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0c0e0c" rx="40"/>
  <!-- Elegant Outer Ring -->
  <circle cx="250" cy="210" r="140" fill="none" stroke="#c17a54" stroke-width="2" stroke-dasharray="4 2" opacity="0.6"/>
  <circle cx="250" cy="210" r="130" fill="none" stroke="#c17a54" stroke-width="1.5"/>
  
  <!-- Stylized Monogram H with leaf accent -->
  <path d="M210 145 V275" stroke="#f5f7ed" stroke-width="6" stroke-linecap="round"/>
  <path d="M290 145 V275" stroke="#f5f7ed" stroke-width="6" stroke-linecap="round"/>
  <path d="M210 210 H290" stroke="#c17a54" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Subtle Botanical Leaf Silhouette -->
  <path d="M250 170 Q280 185 270 210 Q250 205 250 170 Z" fill="#c17a54" opacity="0.85"/>
  <path d="M250 210 Q220 235 230 250 Q250 240 250 210 Z" fill="#c17a54" opacity="0.4"/>

  <!-- Brand Typography -->
  <text x="250" y="390" text-anchor="middle" font-family="'Playfair Display', serif" font-size="34" font-weight="600" fill="#f5f7ed" letter-spacing="4">HARSHA'S</text>
  <text x="250" y="425" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="14" font-weight="500" fill="#c17a54" letter-spacing="8">SKIN CARE</text>
</svg>
